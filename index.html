<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VCS Dashboard – Servier Egypt (Plan 2027)</title>
<style>
:root{--hd:#072847;--gray:#656464;--blue:#0a8cfe;--red:#ec3739;--yel:#fec436;--grn:#72a347;--bar1:#319efd;--bar2:#fdc63f;--area:#a1d1fd;--ink:#0b2a6b;--bg:#e9eff7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);padding:10px}
.wrap{max-width:1600px;margin:auto;display:grid;gap:12px}
header{background:var(--hd);border-radius:14px;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:8px 22px;border:2px solid #14406b}
header img{height:46px}h1{margin:0;font-size:clamp(26px,3.2vw,44px);font-weight:700}
.run{background:#fff;color:#0a3d91;border:0;border-radius:6px;font-weight:700;font-size:20px;padding:10px 26px;cursor:pointer;box-shadow:0 3px 8px #0006}
.run:hover{background:#dce9ff}.date{font-size:20px;font-weight:600;margin-left:24px}
.hr{display:flex;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.k{border-radius:16px;color:#fff;text-align:center;padding:10px 6px 8px;box-shadow:0 5px 10px #0003;cursor:pointer;transition:.15s}.k:hover{transform:translateY(-3px)}
.k h3{margin:2px 0 6px;font-size:clamp(18px,2vw,28px)}.k div{display:flex;justify-content:center;align-items:center;gap:20px;font-size:clamp(40px,4.4vw,64px);font-weight:700}.k i{font-style:normal;font-size:.7em;filter:grayscale(1) brightness(0) invert(1)}
.grid{display:grid;grid-template-columns:1.06fr .97fr 1fr;gap:12px}
.c{background:#fff;border-radius:14px;padding:10px 16px;box-shadow:0 2px 6px #0002;min-height:210px;overflow:hidden}
.c h2{margin:0 0 6px;text-align:center;font-size:clamp(22px,2.3vw,34px)}
.span2{grid-column:span 2}
.br{display:grid;grid-template-columns:130px 1fr 34px;align-items:center;gap:8px;font-size:14px;margin:7px 0}.br span:first-child{text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br b{display:block;height:20px;border-radius:2px;transition:width .6s}.br em{font-style:normal;font-size:13px}
.donut{display:flex;align-items:center;justify-content:space-around;height:150px;font-size:20px}.lg div{margin:8px 0}.lg i{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:8px}
.flt{max-height:190px;overflow:auto;font-size:20px;font-weight:600}.flt label{display:flex;align-items:center;gap:10px;margin:7px 0;cursor:pointer}.flt input{width:20px;height:20px}
.flt .x{cursor:pointer;width:18px}.sub{margin-left:44px;font-size:15px;font-weight:500;display:none}.sub.o{display:block}
.tb{max-height:290px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:15px}th{position:sticky;top:0;background:#fff;text-align:left;padding:6px 8px;border-bottom:2px solid #ddd}td{padding:4px 8px;border-bottom:1px solid #eee}
.st{color:#fff;text-align:center;font-weight:600}.qa{display:flex;align-items:center;justify-content:space-around;height:150px}
.hse{border:4px solid #0a2a7a;border-radius:40px;padding:14px 26px;font-size:34px;font-weight:800;color:#0a2a7a;cursor:pointer}.nm{width:100px;height:100px;border:10px solid #e82f31;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#111;cursor:pointer}
.qa img{height:90px;border-radius:6px;cursor:pointer}.qa>*{transition:.15s}.qa>*:hover{transform:scale(1.07)}
.reset{float:right;font-size:12px;color:#0a58d6;cursor:pointer}
@media(max-width:1000px){.grid{grid-template-columns:1fr}.span2{grid-column:auto}.kpis{grid-template-columns:repeat(2,1fr)}header{flex-wrap:wrap;gap:8px}}
</style></head><body><div class="wrap">
